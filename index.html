<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="可离线运行的三维场平教学游戏">
<title>场平实验室 · 推土模拟</title>
<style>
:root{color-scheme:dark;--bg:#101617;--panel:#182122;--line:#344244;--text:#eef0e9;--muted:#b0bfba;--gold:#f1c768;--green:#8ac79c;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);min-width:310px}
header,main{width:min(1480px,100%);margin:auto;padding-inline:clamp(14px,2.6vw,38px)}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:19px;padding-bottom:17px}
.brand{display:flex;align-items:center;gap:13px}.mark{color:var(--gold);border:1px solid #8d794e;border-radius:9px;width:38px;height:38px;display:grid;place-items:center;font-size:23px}
h1,h2,p{margin:0}h1{font-size:clamp(21px,2.5vw,31px);letter-spacing:.06em}h2{font-size:16px}
header p,.sub{color:var(--muted);font-size:14px}
main{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px;padding-bottom:20px}
.work{display:grid;grid-template-rows:auto minmax(440px,1fr) auto;gap:12px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.stat{padding:11px 12px;min-width:0}.stat+.stat{border-left:1px solid var(--line)}
.stat span,.units{font-size:13px;color:var(--muted)}.stat strong{display:block;font:600 clamp(16px,2vw,28px)/1.2 ui-monospace,Consolas,monospace;margin:4px 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cut{color:#ffa68e}.fill{color:#9ed8a9}.score{color:var(--gold)}
#view{position:relative;overflow:hidden;min-height:440px;border-radius:13px;border:1px solid var(--line);background:#202c2d;touch-action:none}
canvas{display:block;width:100%;height:100%;outline:none;position:absolute;inset:0;cursor:grab}canvas:active{cursor:grabbing}
.view-top,.view-bottom{position:absolute;left:13px;right:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;flex-wrap:wrap}
.view-top{top:13px}.view-bottom{bottom:12px}.view-top button{pointer-events:auto}
.tag,.legend{background:#121c1deb;border:1px solid #435051;border-radius:7px;padding:7px 10px;font-size:13px;color:#e7ebe2}
.legend{display:flex;gap:11px;align-items:center}.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.help{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;padding:9px 2px;color:var(--muted);font-size:14px}
kbd{font:inherit;border:1px solid #455655;border-radius:4px;padding:1px 5px;color:var(--text);background:#202b2c}
aside{display:grid;align-content:start;gap:12px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:15px;display:grid;gap:11px}
.line{display:flex;align-items:center;justify-content:space-between;gap:8px}
output{font:600 14px ui-monospace,Consolas,monospace;color:var(--gold);white-space:nowrap}
label{font-size:14px;color:var(--muted)}button,select{font:inherit;font-size:14px;border:1px solid #475756;border-radius:7px;background:#253233;color:var(--text);padding:8px 10px;cursor:pointer}
button:hover:not(:disabled),select:hover{border-color:var(--gold)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button:disabled{opacity:.5;cursor:default}
.primary{background:var(--gold);border-color:var(--gold);color:#262014;font-weight:700}.primary:hover:not(:disabled){background:#ffdb87}
.split{display:grid;grid-template-columns:1fr 1fr;gap:7px}.split button{padding-inline:4px}
input[type=range]{width:100%;margin:3px 0 0;accent-color:var(--gold);display:block}
meter{appearance:none;width:100%;height:10px;border:0;background:#101617;border-radius:6px;display:block}
meter::-webkit-meter-bar{background:#101617;border:0;height:10px}meter::-webkit-meter-optimum-value{background:var(--gold);border-radius:6px}
#balance,#status{font-size:13px;color:var(--muted);line-height:1.55}
#results{width:100%;border-collapse:collapse;text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
#results th:first-child,#results td:first-child{text-align:left}#results td,#results th{padding:6px 1px;border-bottom:1px solid var(--line)}#results th{color:var(--muted);font-weight:500}
[hidden]{display:none!important}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr) 265px}.stat{padding:8px 6px}.stat span,.units{font-size:12px}}
@media(max-width:730px){main{grid-template-columns:1fr}aside{grid-template-columns:repeat(2,minmax(0,1fr))}.work{grid-template-rows:auto minmax(390px,60vh) auto}#view{min-height:390px}}
@media(max-width:460px){aside{grid-template-columns:1fr}header p{display:none}.view-bottom #coords{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark" aria-hidden="true">▧</span><h1>场平实验室</h1></div>
  <p>推土模拟 / 单机四邻域</p>
</header>
<main>
  <section class="work" aria-label="场平作业区">
    <div class="stats">
      <div class="stat"><span>剩余挖方</span><strong class="cut" id="cut">–</strong><small class="units">m³</small></div>
      <div class="stat"><span>剩余填方</span><strong class="fill" id="fill">–</strong><small class="units">m³</small></div>
      <div class="stat"><span>搬运功</span><strong class="score" id="work">–</strong><small class="units">m³·步</small></div>
      <div class="stat"><span>空驶步数</span><strong id="empty">–</strong><small class="units">步</small></div>
      <div class="stat"><span>完成度</span><strong id="progress">–</strong><small class="units">按剩余挖填量</small></div>
    </div>
    <div id="view">
      <div class="view-top"><span class="tag" id="mode">玩家作业</span><button id="camera" type="button">切换顶视</button></div>
      <div class="view-bottom">
        <div class="legend"><span><i class="dot" style="background:#d57a60"></i>挖方</span><span><i class="dot" style="background:#74bd8c"></i>填方</span><span><i class="dot" style="background:#939b99"></i>达标</span></div>
        <span class="tag" id="coords"></span>
      </div>
    </div>
    <div class="help"><span><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> / <kbd>方向键</kbd> 移动</span><span><kbd>空格</kbd> 切换铲刀</span><span>拖动旋转 · 滚轮缩放</span></div>
  </section>
  <aside>
    <section class="card">
      <div class="line"><h2>铲刀载量</h2><output id="loadText"></output></div>
      <meter id="loadBar" min="0" max="1" value="0" aria-label="铲刀载量"></meter>
      <button id="blade" type="button">放下铲刀</button>
    </section>
    <section class="card">
      <h2>实验参数</h2>
      <div class="line"><label for="size">格网尺寸</label><select id="size"><option value="16">16 × 16</option><option value="32" selected>32 × 32</option><option value="64">64 × 64</option></select></div>
      <div><div class="line"><label for="capacity">刀容量</label><output id="capacityText"></output></div><input id="capacity" type="range" min=".5" max="8" step=".25" value="2"></div>
      <div><div class="line"><label for="rough">地形起伏度</label><output id="roughText"></output></div><input id="rough" type="range" min=".25" max="3" step=".05" value="1.25"></div>
      <div><div class="line"><label for="target">目标高程</label><output id="targetText"></output></div><input id="target" type="range" min="-1" max="1" step=".01" value="0"></div>
      <div id="balance"></div>
      <div class="split"><button id="mean" type="button">目标设为均值</button><button id="restart" type="button">重玩同一地形</button></div>
      <button id="regen" type="button">重新生成地形</button>
    </section>
    <section class="card">
      <h2>课堂对照</h2>
      <p class="sub">就近贪心 · 蛇形顺序处理同距候选</p>
      <button id="demo" class="primary" type="button">电脑 AI 演示</button>
      <div class="line"><label for="speed">演示速度</label><select id="speed"><option value="8">8 步/秒</option><option value="80" selected>80 步/秒</option><option value="800">800 步/秒</option></select></div>
      <table id="results" hidden><thead><tr><th scope="col">指标</th><th scope="col">玩家</th><th scope="col">贪心 AI</th></tr></thead><tbody id="resultRows"></tbody></table>
      <p id="status" role="status">放下铲刀进入挖方格，带土经过填方格即可卸土。</p>
      <div class="line" id="archive" hidden><label for="round">动作记录</label><select id="round"><option value="">当前局</option></select></div>
      <button id="download" type="button">下载玩家动作 JSON</button>
    </section>
  </aside>
</main>
<script src="./three.r160.js"></script>
<script id="simulation">
'use strict';
const Earthwork = (() => {
  const epsilon = 1e-9;
  function makeTerrain(n, roughness, seed) {
    let state = seed >>> 0;
    function random() {
      state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
      return state / 4294967296;
    }
    const phases = Array.from({length: 4}, () => random() * 2 * Math.PI);
    const noise = Array.from({length: n * n}, random);
    const heights = Float64Array.from(noise, (_, i) => {
      const x = i % n / (n - 1) * Math.PI;
      const z = Math.floor(i / n) / (n - 1) * Math.PI;
      function sample(dx, dz) {
        const column = Math.max(0, Math.min(n - 1, i % n + dx));
        const row = Math.max(0, Math.min(n - 1, Math.floor(i / n) + dz));
        return noise[row * n + column];
      }
      const smooth = (4 * sample(0, 0) + sample(-1, 0) + sample(1, 0) + sample(0, -1) + sample(0, 1)) / 8;
      return 3 + roughness * (.86 * Math.sin(2*x + phases[0]) * Math.cos(2*z + phases[1])
        + .55 * Math.sin(1.5*x + 2.3*z + phases[2]) + .29 * Math.cos(3.8*x - 2.5*z + phases[3])
        + .22 * (smooth - .5));
    });
    return {n, roughness, seed, heights, mean: heights.reduce((sum, h) => sum + h, 0) / heights.length};
  }
  function start(terrain, target, capacity, record = true) {
    const grid = Float64Array.from(terrain.heights, h => h - target);
    let cut = 0, fill = 0;
    for (const value of grid) {
      cut += Math.max(0, value);
      fill += Math.max(0, -value);
    }
    return {terrain, grid, target, capacity, cut, fill, initial: cut + fill, position: 0,
      down: false, load: 0, work: 0, empty: 0, steps: 0, record, actions: [], started: Date.now()};
  }
  function complete(run) {
    return run.cut <= epsilon && run.fill <= epsilon && run.load <= epsilon;
  }
  function act(run, type, dx = 0, dz = 0) {
    if (complete(run)) return null;
    const n = run.terrain.n;
    const from = run.position;
    const edgeLoad = run.load;
    if (type === 'move') {
      const x = from % n + dx;
      const z = Math.floor(from / n) + dz;
      if (!Number.isInteger(dx) || !Number.isInteger(dz) || Math.abs(dx) + Math.abs(dz) !== 1
          || x < 0 || x >= n || z < 0 || z >= n) return null;
      run.position = z * n + x;
      run.steps++;
      run.work += edgeLoad;
      if (edgeLoad <= epsilon) run.empty++;
    } else if (type === 'blade') {
      run.down = !run.down;
    } else {
      return null;
    }
    const i = run.position;
    let loaded = 0, unloaded = 0;
    if (type === 'move' && run.grid[i] < -epsilon && run.load > epsilon) {
      unloaded = Math.min(run.load, -run.grid[i]);
      run.grid[i] += unloaded;
      run.load -= unloaded;
      run.fill -= unloaded;
    }
    if (run.down && run.grid[i] > epsilon && run.capacity - run.load > epsilon) {
      loaded = Math.min(run.capacity - run.load, run.grid[i]);
      run.grid[i] -= loaded;
      run.load += loaded;
      run.cut -= loaded;
    }
    if (run.record) run.actions.push({
      tMs: Date.now() - run.started, type, from, to: i, bladeDown: run.down,
      edgeLoad: type === 'move' ? edgeLoad : 0, loaded, unloaded, loadAfter: run.load
    });
    return i;
  }
  function nextAI(run) {
    if (complete(run) || run.fill <= epsilon) return null;
    if (!run.down) return ['blade'];
    const seekFill = run.load > epsilon;
    const n = run.terrain.n;
    const x = run.position % n;
    const z = Math.floor(run.position / n);
    let best = -1;
    // Search successive Manhattan rings, visiting each row in serpentine order.
    if (seekFill ? run.fill <= epsilon : run.cut <= epsilon) return null;
    const farthest = Math.max(x, n-1-x) + Math.max(z, n-1-z);
    for (let distance = 1; distance <= farthest && best < 0; distance++) {
      const firstRow = Math.max(0, z-distance);
      const lastRow = Math.min(n-1, z+distance);
      for (let row = firstRow; row <= lastRow; row++) {
        const span = distance - Math.abs(row-z);
        const direction = row % 2 ? -1 : 1;
        const first = x - direction * span;
        const last = x + direction * span;
        for (const column of span ? [first,last] : [x]) {
          if (column < 0 || column >= n) continue;
          const i = row*n + column;
          if (seekFill ? run.grid[i] < -epsilon : run.grid[i] > epsilon) {
            best = i;
            break;
          }
        }
        if (best >= 0) break;
      }
    }
    if (best < 0) return null;
    const dx = Math.sign(best % n - x);
    return ['move', dx, dx ? 0 : Math.sign(Math.floor(best / n) - z)];
  }
  return {makeTerrain, start, complete, act, nextAI, epsilon};
})();
</script>
<script>
'use strict';
(() => {
  const $ = id => document.getElementById(id);
  const view = $('view');
  const format = (n, digits = 2) => Math.max(0, n).toLocaleString('zh-CN', {
    maximumFractionDigits: digits, minimumFractionDigits: digits
  });
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
  } catch {
    $('mode').textContent = '三维视图需要 WebGL';
    $('status').textContent = '请在启用了硬件加速的 Chrome 或 Edge 中打开。';
    for (const control of document.querySelectorAll('button, select, input')) control.disabled = true;
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.6));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.autoUpdate = false;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.domElement.tabIndex = 0;
  renderer.domElement.setAttribute('aria-label', '三维作业区，使用方向键和空格操作');
  view.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x253334);
  const camera = new THREE.OrthographicCamera();
  scene.add(new THREE.HemisphereLight(0xfff2d8, 0x839b9a, 2));
  const sun = new THREE.DirectionalLight(0xffe7c0, 2.2);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.normalBias = .045;
  sun.shadow.bias = -.0002;
  scene.add(sun, sun.target);

  const box = new THREE.BoxGeometry();
  const material = color => new THREE.MeshStandardMaterial({color, roughness:.88});
  const soilMat = material(0xffffff);
  const base = new THREE.Mesh(box, material(0x283734));
  base.receiveShadow = true;
  scene.add(base);
  function part(group, mat, x, y, z, w, h, d) {
    const mesh = new THREE.Mesh(box, mat);
    mesh.position.set(x,y,z);
    mesh.scale.set(w,h,d);
    mesh.castShadow = true;
    group.add(mesh);
    return mesh;
  }
  const dozer = new THREE.Group();
  scene.add(dozer);
  const locator = new THREE.Mesh(new THREE.RingGeometry(.58,.64,24),
    new THREE.MeshBasicMaterial({color:0xffca60, depthWrite:false}));
  locator.rotation.x = -Math.PI/2;
  locator.position.y = .025;
  dozer.add(locator);
  const yellow = material(0xf4ad35), dark = material(0x202923), steel = material(0x9faeb2);
  part(dozer, dark, -.3,.095,0,.19,.19,.82);
  part(dozer, dark, .3,.095,0,.19,.19,.82);
  part(dozer, yellow, 0,.23,0,.53,.28,.73);
  part(dozer, dark, 0,.43,-.18,.39,.3,.32);
  part(dozer, yellow, 0,.59,-.18,.46,.075,.42);
  part(dozer, steel, 0,.46,.005,.3,.14,.035);
  const blade = new THREE.Group();
  blade.position.set(0,.2,.31);
  dozer.add(blade);
  part(blade, yellow, -.28,0,.13,.075,.075,.34);
  part(blade, yellow, .28,0,.13,.075,.075,.34);
  part(blade, steel, 0,.045,.31,.98,.23,.095);
  part(blade, dark, 0,-.065,.32,1,.055,.11);
  const pile = new THREE.Mesh(new THREE.IcosahedronGeometry(.4, 0), material(0x8e5f39));
  pile.position.set(0,.31,-.48);
  pile.castShadow = true;
  dozer.add(pile);

  const transform = new THREE.Object3D();
  const red = new THREE.Color(0xb54132), paleRed = new THREE.Color(0xd28b74);
  const green = new THREE.Color(0x28724d), paleGreen = new THREE.Color(0x83b493);
  const gray = new THREE.Color(0x899692), color = new THREE.Color();
  const pending = new Set();
  const held = new Map();
  const archived = [];
  const keys = {KeyW:[0,-1],ArrowUp:[0,-1],KeyS:[0,1],ArrowDown:[0,1],
    KeyA:[-1,0],ArrowLeft:[-1,0],KeyD:[1,0],ArrowRight:[1,0]};
  let terrain, run, player, ai, tiles, shown, floor, aim = 0;
  let playing = false, top = false, yaw = .63, pitch = .86, zoom = 1;
  let aiCredit = 0, lastMove = 0, lastFrame = 0, dirty = true;

  function focus() {
    renderer.domElement.focus({preventScroll:true});
  }
  function cameraUpdate() {
    const n = terrain.n;
    const aspect = view.clientWidth / Math.max(1, view.clientHeight);
    const half = n * (top ? .65 : .76) / zoom;
    const vertical = half / Math.min(1, aspect);
    camera.left = -vertical * aspect;
    camera.right = vertical * aspect;
    camera.top = vertical;
    camera.bottom = -vertical;
    camera.near = .1;
    camera.far = n * 9;
    const radius = n * 2;
    const center = terrain.mean;
    camera.up.set(0, top ? 0 : 1, top ? -1 : 0);
    camera.position.set(top ? 0 : radius * Math.cos(pitch) * Math.sin(yaw),
      center + (top ? radius : radius * Math.sin(pitch)),
      top ? 0 : radius * Math.cos(pitch) * Math.cos(yaw));
    camera.lookAt(0,center,0);
    camera.updateProjectionMatrix();
    dirty = true;
  }
  function tileUpdate(i, height) {
    const n = terrain.n;
    transform.position.set(i % n - (n-1)/2, (height+floor)/2, Math.floor(i/n) - (n-1)/2);
    transform.scale.set(.985, height-floor, .985);
    transform.updateMatrix();
    tiles.setMatrixAt(i, transform.matrix);
    const difference = height - run.target;
    const intensity = Math.min(1, Math.abs(difference) / (terrain.roughness*1.25));
    if (Math.abs(difference) < .001) color.copy(gray);
    else if (difference > 0) color.copy(paleRed).lerp(red, intensity);
    else color.copy(paleGreen).lerp(green, intensity);
    tiles.setColorAt(i, color);
  }
  function positionDozer() {
    const n = terrain.n;
    dozer.position.set(run.position % n - (n-1)/2, shown[run.position] + .025,
      Math.floor(run.position/n) - (n-1)/2);
  }
  function showRun(active) {
    run = active;
    pending.clear();
    shown = Float64Array.from(run.grid, balance => run.target + balance);
    if (!tiles || tiles.count !== shown.length) {
      if (tiles) {
        scene.remove(tiles);
        tiles.dispose();
      }
      tiles = new THREE.InstancedMesh(box, soilMat, shown.length);
      tiles.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      tiles.castShadow = true;
      tiles.receiveShadow = true;
      // Terrain never leaves the frame's bounding area, even after changing target.
      tiles.frustumCulled = false;
      scene.add(tiles);
    }
    const n = terrain.n;
    floor = Math.min(...terrain.heights, run.target) - .65;
    base.position.y = floor - .20;
    base.scale.set(n+.44,.4,n+.44);
    for (let i=0; i<shown.length; i++) tileUpdate(i, shown[i]);
    tiles.instanceMatrix.needsUpdate = true;
    tiles.instanceColor.needsUpdate = true;
    aim = dozer.rotation.y = 0;
    positionDozer();
    sun.position.set(-.7*n,1.6*n,.9*n);
    Object.assign(sun.shadow.camera,{left:-n*.82,right:n*.82,top:n*.82,bottom:-n*.82,near:.1,far:4*n});
    sun.shadow.camera.updateProjectionMatrix();
    renderer.shadowMap.needsUpdate = true;
    cameraUpdate();
    updateHUD();
  }
  function updateHUD() {
    $('cut').textContent = format(run.cut);
    $('fill').textContent = format(run.fill);
    $('work').textContent = format(run.work);
    $('empty').textContent = format(run.empty,0);
    const done = Earthwork.complete(run);
    // In transit soil still contributes to the unfinished fill quantity.
    const progress = done ? 100 : Math.min(99.9, 100*(1-(run.cut+run.fill)/run.initial));
    $('progress').textContent = format(progress,1) + '%';
    $('loadText').textContent = format(run.load) + ' / ' + format(run.capacity) + ' m³';
    $('loadBar').max = run.capacity;
    $('loadBar').value = run.load;
    $('blade').textContent = run.down ? '提起铲刀' : '放下铲刀';
    $('blade').disabled = playing || run !== player || done;
    $('coords').textContent = '列 ' + (run.position % terrain.n + 1) + ' · 行 '
      + (Math.floor(run.position / terrain.n)+1) + ' · ' + (run.down ? '铲刀下放' : '铲刀抬起');
    $('mode').textContent = run === player ? (done ? '玩家已完成' : '玩家作业') : (playing ? 'AI 演示中' : 'AI 演示结果');
  }
  function results() {
    $('results').hidden = !Earthwork.complete(player) && !ai;
    const aiScore = ai && !playing;
    const rows = [
      ['搬运功', format(player.work), aiScore ? format(ai.work) : '—'],
      ['空驶步数', format(player.empty,0), aiScore ? format(ai.empty,0) : '—'],
      ['完成', Earthwork.complete(player) ? '是' : '否', aiScore ? (Earthwork.complete(ai) ? '是' : '否') : '—']
    ];
    $('resultRows').replaceChildren(...rows.map(values => {
      const row = document.createElement('tr');
      for (const value of values) row.insertCell().textContent = value;
      return row;
    }));
  }
  function updateBalance(target) {
    const surplus = (terrain.mean - target) * terrain.heights.length;
    $('balance').textContent = Math.abs(surplus) <= Earthwork.epsilon
      ? '土方平衡 · 参数提交后开始新一局'
      : (surplus > 0 ? '需弃土 ' : '需借土 ') + format(Math.abs(surplus))
        + ' m³。本局为封闭场地，无法全部达标。';
    $('targetText').textContent = target.toFixed(2) + ' m';
  }
  function newRound() {
    playing = false;
    ai = null;
    held.clear();
    const target = terrain.mean + Number($('target').value);
    if (player?.actions.length) {
      const index = archived.push(player) - 1;
      $('round').add(new Option('第 ' + (index + 1) + ' 局 · ' + player.terrain.n + ' × ' + player.terrain.n, index));
      $('archive').hidden = false;
    }
    $('round').value = '';
    player = Earthwork.start(terrain, target, Number($('capacity').value));
    $('demo').textContent = '电脑 AI 演示';
    $('status').textContent = '放下铲刀进入挖方格，带土经过填方格即可卸土。';
    updateBalance(target);
    showRun(player);
    results();
    focus();
  }
  function generate() {
    terrain = Earthwork.makeTerrain(Number($('size').value), Number($('rough').value),
      crypto.getRandomValues(new Uint32Array(1))[0]);
    const range = Math.ceil((Math.max(...terrain.heights) - Math.min(...terrain.heights)) * 100)/100;
    $('target').min = -range;
    $('target').max = range;
    $('target').value = '0';
    $('roughText').textContent = terrain.roughness.toFixed(2);
    newRound();
  }
  function perform(action) {
    const changed = Earthwork.act(run, ...action);
    if (changed === null) return false;
    if (action[0] === 'move') aim = Math.atan2(action[1], action[2]);
    pending.add(changed);
    dirty = true;
    return true;
  }
  function playerAction(action) {
    if (playing || run !== player || !perform(action)) return;
    updateHUD();
    if (Earthwork.complete(player)) {
      $('status').textContent = '场平完成。可用同一初始地形运行 AI，对照搬运功和空驶步数。';
      results();
    } else if (ai) {
      results();
    }
  }
  function stopAI(finished) {
    playing = false;
    if (finished) {
      $('demo').textContent = '返回玩家作业';
      $('status').textContent = Earthwork.complete(ai)
        ? 'AI 已完成。同一地形、容量、目标高程和起点下的成绩见上表。'
        : 'AI 已无可继续的挖填配对。当前目标存在土方缺口或余量。';
      updateHUD();
    } else {
      if (!Earthwork.complete(ai)) ai = null;
      $('demo').textContent = '电脑 AI 演示';
      $('status').textContent = '已返回玩家作业，可继续原有进度。';
      showRun(player);
    }
    results();
    focus();
  }
  $('demo').onclick = () => {
    if (run !== player) {
      stopAI(false);
      return;
    }
    held.clear();
    ai = Earthwork.start(terrain, player.target, player.capacity, false);
    playing = true;
    aiCredit = 0;
    $('demo').textContent = '停止演示并返回玩家';
    $('status').textContent = 'AI 从同一起点出发，空载找最近挖格，带土找最近填格。';
    showRun(ai);
    results();
    focus();
  };
  $('download').onclick = () => {
    const selected = $('round').value;
    const record = selected === '' ? player : archived[Number(selected)];
    const field = record.terrain;
    const data = {
      schemaVersion: 1, startedAt: new Date(record.started).toISOString(),
      terrain: {size: field.n, cellSideM: 1, seed: field.seed, roughness: field.roughness,
        initialHeightsM: Array.from(field.heights)},
      targetElevationM: record.target, bladeCapacityM3: record.capacity, initialPosition: 0, initialBladeDown: false,
      score: {complete: Earthwork.complete(record), cutM3: record.cut, fillM3: record.fill,
        loadM3: record.load, workM3Steps: record.work, emptySteps: record.empty, steps: record.steps},
      actions: record.actions
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
    const link = document.createElement('a');
    link.href = url;
    link.download = '场平动作-' + field.seed + '-' + record.started + '.json';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    focus();
  };
  $('camera').onclick = () => {
    top = !top;
    $('camera').textContent = top ? '切换自由视角' : '切换顶视';
    cameraUpdate();
    focus();
  };
  $('blade').onclick = () => { playerAction(['blade']); focus(); };
  $('size').onchange = generate;
  $('regen').onclick = generate;
  $('restart').onclick = newRound;
  $('mean').onclick = () => { $('target').value = '0'; newRound(); };
  $('capacity').oninput = () => { $('capacityText').textContent = format(Number($('capacity').value)) + ' m³'; };
  $('capacity').oninput();
  $('capacity').onchange = newRound;
  $('rough').oninput = () => { $('roughText').textContent = Number($('rough').value).toFixed(2); };
  $('rough').onchange = generate;
  $('target').oninput = () => updateBalance(terrain.mean + Number($('target').value));
  $('target').onchange = newRound;
  $('speed').onchange = focus;
  $('round').onchange = focus;

  window.addEventListener('keydown', event => {
    if (event.target.closest?.('input, select, button') || event.ctrlKey || event.altKey || event.metaKey) return;
    if (!keys[event.code] && event.code !== 'Space') return;
    event.preventDefault();
    if (run !== player || Earthwork.complete(player)) return;
    if (event.code === 'Space') {
      if (!event.repeat) playerAction(['blade']);
    } else if (!event.repeat) {
      held.set(event.code, keys[event.code]);
      lastMove = performance.now();
      playerAction(['move', ...keys[event.code]]);
    }
  });
  window.addEventListener('keyup', event => held.delete(event.code));
  window.addEventListener('blur', () => held.clear());
  window.addEventListener('focusin', event => {
    if (event.target !== renderer.domElement) held.clear();
  });
  document.addEventListener('visibilitychange', () => held.clear());

  const canvas = renderer.domElement;
  let drag;
  canvas.addEventListener('pointerdown', event => {
    focus();
    if (top || event.button !== 0) return;
    drag = {x:event.clientX,y:event.clientY};
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener('pointermove', event => {
    if (!drag) return;
    yaw -= (event.clientX-drag.x)*.008;
    pitch = Math.max(.25, Math.min(1.48,pitch+(event.clientY-drag.y)*.008));
    drag = {x:event.clientX,y:event.clientY};
    cameraUpdate();
  });
  canvas.addEventListener('lostpointercapture', () => { drag = null; });
  canvas.addEventListener('wheel', event => {
    event.preventDefault();
    zoom = Math.min(4,Math.max(.6,zoom*Math.exp(-event.deltaY*.001)));
    cameraUpdate();
  }, {passive:false});

  function frame(now) {
    const elapsed = Math.min(.05,(now-lastFrame)/1000);
    lastFrame = now;
    if (playing) {
      aiCredit += elapsed * Number($('speed').value);
      let acted = false;
      while (aiCredit >= 1) {
        aiCredit--;
        const action = Earthwork.nextAI(ai);
        if (!action) { stopAI(true); break; }
        acted = perform(action) || acted;
      }
      if (acted) updateHUD();
    } else if (held.size && now-lastMove >= 100) {
      lastMove = now;
      playerAction(['move', ...Array.from(held.values()).at(-1)]);
    }
    const easing = 1-Math.exp(-18*elapsed);
    if (pending.size) {
      for (const i of pending) {
        const finalHeight = run.target + run.grid[i];
        shown[i] += (finalHeight-shown[i])*easing;
        if (Math.abs(finalHeight-shown[i]) < .002) {
          shown[i] = finalHeight;
          pending.delete(i);
        }
        tileUpdate(i, shown[i]);
      }
      tiles.instanceMatrix.needsUpdate = true;
      tiles.instanceColor.needsUpdate = true;
      positionDozer();
      renderer.shadowMap.needsUpdate = true;
      dirty = true;
    }
    const turn = Math.atan2(Math.sin(aim-dozer.rotation.y),Math.cos(aim-dozer.rotation.y));
    if (Math.abs(turn) > .002) {
      dozer.rotation.y += turn * easing;
      renderer.shadowMap.needsUpdate = true;
      dirty = true;
    }
    const bladeAngle = run.down ? .30 : -.36;
    if (Math.abs(bladeAngle-blade.rotation.x) > .002) {
      blade.rotation.x += (bladeAngle-blade.rotation.x)*easing;
      renderer.shadowMap.needsUpdate = true;
      dirty = true;
    }
    const loaded = run.load > Earthwork.epsilon;
    if (loaded) {
      const size = Math.max(.25,Math.cbrt(run.load / run.capacity));
      pile.scale.set(size,size*.8,size);
    }
    if (pile.visible !== loaded) {
      pile.visible = loaded;
      renderer.shadowMap.needsUpdate = true;
      dirty = true;
    }
    if (dirty) {
      renderer.render(scene,camera);
      dirty = false;
    }
    requestAnimationFrame(frame);
  }
  generate();
  new ResizeObserver(() => {
    renderer.setSize(view.clientWidth,view.clientHeight,false);
    cameraUpdate();
  }).observe(view);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
